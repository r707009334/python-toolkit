<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f4e79">
<title>每日汇总</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#f5f7fa;color:#1f2937;
 font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
 display:flex;align-items:center;justify-content:center;padding:24px}
.box{width:100%;max-width:380px}
.brand{display:flex;align-items:center;gap:9px;margin-bottom:22px;justify-content:center}
.dot{width:9px;height:9px;border-radius:50%;background:#1f4e79}
.brand b{font-size:17px;letter-spacing:.5px}
.brand span{font-size:12px;color:#6b7280}
h1{font-size:20px;margin:0 0 6px;text-align:center;font-weight:700}
.sub{font-size:12.5px;color:#6b7280;text-align:center;margin-bottom:22px;line-height:1.7}
label{display:block;font-size:12px;color:#6b7280;margin:0 0 7px 2px}
input{width:100%;padding:14px 15px;font-size:16px;border:1px solid #d7dde5;border-radius:10px;
 background:#fff;outline:none;font-family:inherit;-webkit-appearance:none}
input:focus{border-color:#1f4e79;box-shadow:0 0 0 3px rgba(31,78,121,.09)}
button{width:100%;margin-top:13px;padding:14px;font-size:16px;font-weight:600;color:#fff;
 background:#1f4e79;border:0;border-radius:10px;font-family:inherit;cursor:pointer}
button:active{background:#173b5c}
button:disabled{background:#9db4cc;cursor:default}
.rem{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:#4b5563}
.rem input{width:17px;height:17px;padding:0;flex:0 0 auto;accent-color:#1f4e79}
.err{margin-top:12px;font-size:13px;color:#b42318;background:#fdf3f2;border:1px solid #f2c8c3;
 border-radius:9px;padding:10px 12px;display:none}
.err.on{display:block}
.foot{margin-top:26px;font-size:11px;color:#9aa3af;text-align:center;line-height:1.8}
.busy{display:none;margin-top:16px;text-align:center;font-size:13px;color:#6b7280}
.busy.on{display:block}
@keyframes bl{0%,100%{opacity:.35}50%{opacity:1}}
.busy i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#1f4e79;
 margin:0 3px;animation:bl 1.1s infinite}
.busy i:nth-child(2){animation-delay:.18s}.busy i:nth-child(3){animation-delay:.36s}
</style></head>
<body>
<div class="box">
  <div class="brand"><span class="dot"></span><b>每日汇总</b><span>加密看板</span></div>
  <h1>输入密码</h1>
  <p class="sub">页面内容在服务器上是密文，<br>密码只在本机校验，不会上传。</p>
  <form id="f" autocomplete="on">
    <label for="pw">访问密码</label>
    <input id="pw" type="password" inputmode="text" autocapitalize="off"
      autocorrect="off" spellcheck="false" autocomplete="current-password" autofocus>
    <div class="rem"><input id="rm" type="checkbox" checked><label for="rm"
      style="margin:0;font-size:13px;color:#4b5563">在这台设备上记住</label></div>
    <button id="go" type="submit">打开</button>
  </form>
  <div class="busy" id="busy"><i></i><i></i><i></i><div style="margin-top:7px">解密中…</div></div>
  <div class="err" id="err"></div>
  <div class="foot">数据截至 2026-10-28<br>仅供个人查看，不构成投资建议</div>
</div>
<script src="payload.js"></script>
<script>
var SALT='J2ZXOhfVjfRMPPMQask5gw==', IV='tXDRFTdN1VI5OE8D', LS='hx300_key_v1';
function b64d(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function b64e(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function $(id){return document.getElementById(id)}
function fail(m){var e=$('err');e.textContent=m;e.className='err on';$('busy').className='busy';$('go').disabled=false}

function keyFromPass(pw){
  var enc=new TextEncoder();
  return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey'])
    .then(function(base){
      return crypto.subtle.deriveKey(
        {name:'PBKDF2',salt:b64d(SALT),iterations:250000,hash:'SHA-256'},
        base,{name:'AES-GCM',length:256},true,['decrypt']);
    });
}

function render(html){
  document.open();document.write(html);document.close();
}

function go(key,save){
  var raw=window.__D;
  if(!raw){fail('数据没加载成功，下拉刷新重试');return}
  var bin=b64d(raw);
  crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(IV)},key,bin).then(function(buf){
    var blob=new Blob([buf]);
    if(typeof DecompressionStream==='undefined'){
      fail('浏览器太旧，请用最新版 Safari / Chrome / 微信内置浏览器');return;
    }
    return new Response(blob.stream().pipeThrough(new DecompressionStream('gzip')))
      .text().then(function(html){
        if(save){
          crypto.subtle.exportKey('raw',key).then(function(k){
            try{localStorage.setItem(LS,b64e(new Uint8Array(k)))}catch(e){}
          });
        }
        render(html);
      });
  }).catch(function(){fail('密码不对，再试一次');});
}

$('f').addEventListener('submit',function(ev){
  ev.preventDefault();
  var pw=$('pw').value.trim();
  if(!pw){fail('请输入密码');return}
  $('err').className='err';$('go').disabled=true;$('busy').className='busy on';
  keyFromPass(pw).then(function(k){go(k,$('rm').checked)});
});

// 已记住的设备：直接解锁
(function(){
  var saved=null;
  try{saved=localStorage.getItem(LS)}catch(e){}
  if(!saved)return;
  $('busy').className='busy on';
  crypto.subtle.importKey('raw',b64d(saved),{name:'AES-GCM'},true,['decrypt'])
    .then(function(k){go(k,false)})
    .catch(function(){try{localStorage.removeItem(LS)}catch(e){};$('busy').className='busy';});
})();
</script>
</body></html>

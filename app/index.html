<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="每日监控">
<meta name="theme-color" content="#1f4e79">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>每日监控</title>
<style>
:root{
  --ink:#1f2937; --ink2:#4b5563; --ink3:#6b7280; --line:#e5e7eb; --line2:#cbd5e1;
  --bg:#f5f7fa; --card:#fff; --blue:#1f4e79; --amber:#b45309;
  --red:#c0392b; --green:#1e8449;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 30px}

/* 头部 */
header{margin-bottom:12px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.3px}
h1 em{font-style:normal;color:var(--ink3);font-size:11.5px;font-weight:400;margin-left:7px}
#btnRefresh{flex:0 0 auto;border:1px solid #b9cbdd;background:#eef4fa;color:var(--blue);
  font:inherit;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:16px;cursor:pointer}
#btnRefresh:active{background:#dfeaf6}
.sub{font-size:11px;color:var(--ink3);margin-top:6px;line-height:1.6}
.sub .dim{color:#9aa3af}
.spin{display:inline-block;width:9px;height:9px;border:2px solid #cbd5e1;
  border-top-color:var(--blue);border-radius:50%;margin-right:5px;
  animation:sp .7s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}

/* 视图 */
.view{display:none}
.view.on{display:block}

/* 卡片 */
.cards{display:flex;flex-direction:column;gap:11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:13px 14px;position:relative;overflow:hidden;cursor:pointer;
  box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card:active{background:#fbfcfe}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line2)}
.card.s-ok::before{background:var(--blue)}
.card.s-watch::before{background:var(--amber)}
.card.s-buy::before{background:var(--red)}
.card.s-err::before,.card.s-wait::before{background:#9ca3af}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:9px}
.ct{font-size:14.5px;font-weight:700;line-height:1.35}
.ct i{display:block;font-style:normal;font-size:10.5px;color:var(--ink3);
  font-weight:400;margin-top:2px}
.badge{flex:0 0 auto;font-size:10.5px;padding:2px 8px;border-radius:10px;
  border:1px solid;white-space:nowrap;margin-top:1px}
.b-ok{color:var(--blue);border-color:#b9cbdd;background:#eef4fa}
.b-watch{color:var(--amber);border-color:#e8cda0;background:#fdf5e7}
.b-buy{color:var(--red);border-color:#ddb3ab;background:#fbeeec}
.b-err,.b-wait{color:#6b7280;border-color:var(--line);background:#f3f4f6}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 10px}
.kp .k{font-size:10.5px;color:var(--ink3);letter-spacing:.2px}
.kp .v{font-size:16px;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums}
.kp .v small{font-size:10px;font-weight:400;color:var(--ink3);margin-left:2px}
.spl{display:flex;align-items:center;gap:9px;margin-top:8px}
.spl .cap{font-size:10px;color:var(--ink3);white-space:nowrap}
.spl svg{flex:1;height:30px;display:block}
.exp{font-size:10px;color:var(--ink3);margin-top:9px;padding-top:7px;
  border-top:1px dotted var(--line);line-height:1.5}
.cf{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:9px;
  padding-top:8px;border-top:1px dashed var(--line)}
.cl{font-size:11px;color:var(--ink3);line-height:1.5;flex:1}
.cl b{color:var(--ink2);font-weight:600}
.go{font-size:11.5px;color:var(--blue);white-space:nowrap;flex:0 0 auto}
.err{background:#f3f4f6;border:1px solid var(--line);color:#6b7280;
  border-radius:8px;padding:9px 11px;font-size:11.5px;line-height:1.55;
  word-break:break-all}
.tip{font-size:11px;color:#9aa3af;text-align:center;margin:16px 0 0;line-height:1.7}

/* 详情 */
.dbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{border:1px solid #b9cbdd;background:#eef4fa;color:var(--blue);font:inherit;
  font-size:12px;padding:5px 11px;border-radius:14px;cursor:pointer}
.dtitle{font-size:15px;font-weight:700;line-height:1.35}
.dtitle small{display:block;font-size:10.5px;color:var(--ink3);font-weight:400;margin-top:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:12px 13px;margin-bottom:11px}
.panel h3{font-size:12.5px;margin:0 0 8px;font-weight:700;color:var(--ink2)}
.panel h3 span{display:block;font-weight:400;color:var(--ink3);font-size:10.5px;margin-top:2px}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mi{border-left:2px solid var(--blue);padding-left:9px}
.mi .k{font-size:10px;color:var(--ink3)}
.mi .v{font-size:14.5px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.35}
table{width:100%;border-collapse:collapse;font-size:11.5px;display:block;overflow-x:auto;
  -webkit-overflow-scrolling:touch}
thead,tbody{display:table;width:100%}
th,td{padding:6px 7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--ink3);font-weight:600;font-size:10.5px;
  border-bottom:1px solid var(--line2);background:#fff}
td:first-child,th:first-child{text-align:left}
.pos{color:var(--red)}
.neg{color:var(--green)}
.tag{display:inline-block;font-size:9.5px;padding:0 5px;border-radius:7px;
  border:1px solid var(--line);color:var(--ink3);background:#f8fafc;margin-left:3px}
.note{font-size:10.5px;color:var(--ink3);margin:9px 0 0;line-height:1.65}
.note b{color:var(--ink2)}
.warn{background:#fdf5e7;border:1px solid #e8cda0;color:#7c4a00;border-radius:8px;
  padding:9px 11px;font-size:11px;line-height:1.6;margin-top:9px}
.warn.info{background:#eef4fa;border-color:#b9cbdd;color:#1f4e79}
.chart-t{width:100%;margin-top:4px}
.chart-t svg,.ln{width:100%;height:auto;display:block}
.footbtns{margin-top:14px;text-align:center}
.ghost{border:1px solid var(--line2);background:#fff;color:var(--ink2);font:inherit;
  font-size:12px;padding:9px 20px;border-radius:9px;cursor:pointer}
.ghost:disabled{color:#9aa3af}
footer{margin-top:16px;font-size:10px;color:#9aa3af;line-height:1.7;text-align:center}
@media (min-width:560px){
  .cards{flex-direction:row;flex-wrap:wrap}
  .card{flex:1 1 320px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hd">
      <h1>每日监控<em>手机端直连</em></h1>
      <button id="btnRefresh">刷新</button>
    </div>
    <div class="sub"><span id="seedInfo">底库加载中…</span> · <span id="stamp">未更新</span></div>
  </header>

  <div id="sum" class="view on">
    <div id="cards" class="cards"></div>
    <p class="tip">点任意卡片看详情<br>数据由本机浏览器直连行情接口获取，不经过服务器</p>
  </div>

  <div id="detail" class="view"></div>

  <footer>
    指标用后复权价、显示用不复权价　·　历史底库由桌面端预置，之后手机自行补增量<br>
    仅供个人参考，不构成投资建议
  </footer>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
